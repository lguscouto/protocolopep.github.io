<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste Moléculas</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0B1017;overflow:hidden;font-family:sans-serif;}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;}
  .msg{position:relative;z-index:2;color:#2CC5C0;text-align:center;padding-top:40vh;font-size:20px;font-weight:bold;}
  .sub{color:#8A97A6;font-size:14px;font-weight:normal;margin-top:8px;}
  #status{position:fixed;bottom:20px;left:0;right:0;text-align:center;color:#fff;font-size:13px;z-index:3;padding:10px;background:rgba(0,0,0,.5);}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="msg">Teste de Moléculas
  <div class="sub">Se você vê pontinhos verdes se movendo no fundo, funciona!</div>
</div>
<div id="status">Carregando…</div>

<script>
(function(){
  var status = document.getElementById('status');
  function log(msg){ if(status) status.textContent = msg; }
  try{
    var cv = document.getElementById('bg');
    if(!cv){ log('ERRO: canvas não encontrado'); return; }
    var ctx = cv.getContext('2d');
    if(!ctx){ log('ERRO: navegador não suporta canvas 2D'); return; }

    var TEAL=[44,197,192], AQUA=[47,216,172], LINK=140;
    var w,h,dpr,pts;
    function init(){
      dpr = Math.min(window.devicePixelRatio||1, 2);
      var vw = window.innerWidth||360, vh = window.innerHeight||640;
      w = cv.width = vw*dpr;
      h = cv.height = vh*dpr;
      cv.style.width = vw+"px";
      cv.style.height = vh+"px";
      var count = Math.round(Math.min(45, Math.max(18, (vw*vh)/24000)));
      pts = [];
      for(var i=0;i<count;i++){
        pts.push({x:Math.random()*w,y:Math.random()*h,z:Math.random(),
          vx:(Math.random()-.5)*.3*dpr, vy:(Math.random()-.5)*.3*dpr});
      }
    }
    var frames = 0;
    function frame(){
      ctx.clearRect(0,0,w,h);
      var link = LINK*dpr;
      for(var i=0;i<pts.length;i++){
        var p=pts[i]; p.x+=p.vx; p.y+=p.vy;
        if(p.x<0||p.x>w)p.vx*=-1; if(p.y<0||p.y>h)p.vy*=-1;
      }
      for(var i=0;i<pts.length;i++){
        for(var j=i+1;j<pts.length;j++){
          var dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, d=Math.sqrt(dx*dx+dy*dy);
          if(d<link){
            var a=(1-d/link)*0.3;
            ctx.strokeStyle="rgba("+TEAL[0]+","+TEAL[1]+","+TEAL[2]+","+a+")";
            ctx.lineWidth=1;
            ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y); ctx.stroke();
          }
        }
      }
      for(var i=0;i<pts.length;i++){
        var p=pts[i], s=(1.8+p.z*2.4)*dpr, a=0.5+p.z*0.4;
        ctx.fillStyle="rgba("+AQUA[0]+","+AQUA[1]+","+AQUA[2]+","+a+")";
        ctx.beginPath(); ctx.arc(p.x,p.y,s,0,6.2832); ctx.fill();
      }
      frames++;
      if(frames===1) log('✓ FUNCIONANDO! Moléculas rodando. ('+pts.length+' pontos)');
      requestAnimationFrame(frame);
    }
    init();
    frame();
    window.addEventListener('resize', init);
  }catch(e){
    log('ERRO: '+e.message);
  }
})();
</script>
</body>
</html>
