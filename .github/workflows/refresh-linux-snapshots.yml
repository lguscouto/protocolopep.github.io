name: Refresh Linux visual snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Refresh changed Linux snapshots
        run: >-
          npx playwright test tests/e2e/visual-regression.spec.js
          tests/e2e/device-real.spec.js
          --grep "telas preenchidas|captura snapshots"
          --update-snapshots --workers=1

      - name: Upload Linux snapshots
        uses: actions/upload-artifact@v4
        with:
          name: linux-snapshots
          path: tests/e2e/*-snapshots/*-linux.png
          if-no-files-found: error
