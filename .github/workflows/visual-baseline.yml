name: Generate Linux visual baselines

on:
  workflow_dispatch:

jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.21.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Regenerate Linux snapshots
        run: npx playwright test tests/e2e/visual-regression.spec.js tests/e2e/device-real.spec.js --update-snapshots --workers=2
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baselines
          path: |
            tests/e2e/visual-regression.spec.js-snapshots/*-linux.png
            tests/e2e/device-real.spec.js-snapshots/*-linux.png
