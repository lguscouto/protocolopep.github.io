name: CI - Test & Build

on:
  push:
    branches: [ main, hermes, 'codex/**' ]
  pull_request:
    branches: [ main, hermes ]
  workflow_dispatch:
    inputs:
      refresh_snapshots:
        description: "Gerar snapshots Linux atualizados"
        required: false
        default: "false"
        type: boolean

jobs:
  test-and-build:
    name: Node Test & Web Build
    if: github.event_name != 'workflow_dispatch' || inputs.refresh_snapshots != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Web Production Bundle
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E Tests
        run: npm run test:e2e

  android-build:
    name: Android Build & Native Tests
    if: github.event_name != 'workflow_dispatch' || inputs.refresh_snapshots != true
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies & build web
        run: |
          npm ci
          npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Run Android Unit Tests
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Run Android Lint
        run: |
          cd android
          ./gradlew lintDebug

      - name: Assemble Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

  refresh-linux-snapshots:
    name: Refresh Linux visual snapshots
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_snapshots == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Refresh changed Linux snapshots
        run: >-
          npx playwright test tests/e2e/visual-regression.spec.js
          tests/e2e/device-real.spec.js
          --grep "telas preenchidas|captura snapshots"
          --update-snapshots --workers=1
      - name: Upload Linux snapshots
        uses: actions/upload-artifact@v4
        with:
          name: linux-snapshots
          path: tests/e2e/*-snapshots/*-linux.png
          if-no-files-found: error
