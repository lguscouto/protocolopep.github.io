name: CI - Test & Build

on:
  push:
    branches: [ main, hermes ]
  pull_request:
    branches: [ main, hermes ]

jobs:
  test-and-build:
    name: Node Test & Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Build Web Production Bundle
        run: npm run build

  android-build:
    name: Android Build & Native Tests
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies & build web
        run: |
          npm install
          npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Run Android Unit Tests
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Assemble Debug APK
        run: |
          cd android
          ./gradlew assembleDebug
